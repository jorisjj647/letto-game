<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ALPHABALLS</title>
<style>
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:radial-gradient(circle at 50% 18%,#20323e,#080b10 50%,#020304);
    color:#efc74c; font-family:Arial,sans-serif; text-align:center; padding:24px;
  }
  .card{
    width:min(92vw,560px); padding:34px 22px 30px;
    border:1px solid #9b7627; border-radius:18px; background:#070b0ef2;
    box-shadow:0 0 30px #000;
  }
  h1{margin:0 0 8px; font-size:clamp(30px,7vw,48px); letter-spacing:3px}
  .tag{font-size:12px; letter-spacing:1.6px; color:#d8c27a; margin-bottom:30px}
  .choice{
    display:block; width:min(88%,360px); margin:14px auto; padding:17px 14px;
    border:1px solid #c79b34; border-radius:12px;
    background:linear-gradient(#2b210b,#120f07);
    color:#f4d466; text-decoration:none; font-weight:900; font-size:16px;
    letter-spacing:.7px; box-shadow:0 0 14px #e0b02d22;
  }
  .sub{display:block; margin-top:6px; font-size:11px; font-weight:normal; color:#d8c27a}
  .foot{margin-top:28px; font-size:11px; color:#9e8d58}
</style>
</head>
<body>
  <main class="card">
    <h1>ALPHABALLS</h1>
    <div class="tag">CHOISISSEZ VOTRE MODE DE JEU</div>

    <a class="choice" href="https://jorisjj647.github.io/letto-game/ALPHABALLS_BULLETIN_6PLUS4_TEST_15_BULLETIN_GAGNANT.html">
      JOUER EN SOLO
      <span class="sub">1 joueur</span>
    </a>

    <a class="choice" href="https://jorisjj647.github.io/letto-game/ALPHABALLS_JOUER_A_PLUSIEURS_07_2_A_6_JOUEURS.html">
      JOUER À PLUSIEURS
      <span class="sub">2 à 6 joueurs · un seul tirage commun</span>
    </a>

    <div class="foot">ALPHAZARD</div>
  </main>
</body>
</html>
