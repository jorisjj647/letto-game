<!doctype html><html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ALPHABALLS — MÉLANGEUR 03</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 18%,#20323e,#080b10 50%,#020304);font-family:Arial,sans-serif;text-align:center;color:#efc74c}
h1{margin:13px 0 1px;letter-spacing:3px}.sub{font-size:10px;color:#b8c5cc;letter-spacing:1.5px}
#machine{position:relative;width:min(96vw,660px);height:635px;margin:5px auto 0}
#drum{position:absolute;left:50%;top:8px;transform:translateX(-50%);width:min(74vw,380px);height:min(74vw,380px);max-height:380px;border-radius:50%;overflow:hidden;border:7px solid #a97922;background:radial-gradient(circle at 35% 25%,#c6efff33,#132b3822 55%,#0009);box-shadow:inset 0 0 38px #60cfff35,0 0 0 3px #343e45,0 0 30px #e0b02d22}
#drum:after{content:"";position:absolute;inset:8%;border:1px solid #c9f2ff22;border-radius:50%;pointer-events:none}
.b,#trav{position:absolute;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:900;color:#050505;background:radial-gradient(circle at 30% 22%,#fff8ba,#e1ae27 44%,#76500b 84%);border:1px solid #ffe886;box-shadow:0 2px 7px #000c;z-index:4}
#mouth{position:absolute;left:50%;transform:translateX(-50%);top:372px;width:94px;height:45px;background:linear-gradient(90deg,#674512,#e5bc46,#674512);clip-path:polygon(0 0,100% 0,63% 100%,37% 100%);z-index:3}
#capture{position:absolute;left:50%;transform:translateX(-50%);top:411px;width:56px;height:57px;border:5px solid #a97922;border-radius:11px;background:#0a151b;box-shadow:inset 0 0 13px #56cfff33}
#capture:after{content:"CAPTURE";position:absolute;left:50%;transform:translateX(-50%);bottom:-20px;font-size:8px;color:#8da1ab;letter-spacing:1px}
#gate{position:absolute;left:50%;transform:translateX(-50%);top:463px;width:50px;height:7px;background:#efc74c;box-shadow:0 0 8px #efc74c88;z-index:6}
#rail{position:absolute;left:50%;top:490px;width:min(35vw,205px);height:18px;border-top:4px solid #a97922;border-bottom:4px solid #a97922;background:#0b151a}
#trav{display:none;z-index:20;width:34px;height:34px;font-size:19px}
#tray{position:absolute;left:50%;transform:translateX(-50%);top:530px;display:flex;gap:5px}
.slot{width:45px;height:45px;border:2px solid #8e722e;border-radius:50%;display:grid;place-items:center;color:#71808a;font-size:12px;background:#070b0e}
.slot.active{border-color:#efc74c;box-shadow:0 0 12px #efc74c55}.out{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:20px;font-weight:900;color:#050505;background:radial-gradient(circle at 30% 22%,#fff8ba,#e1ae27 44%,#76500b 84%)}
#count{position:absolute;right:2%;top:425px;color:#d6e2e7;font-size:11px;line-height:1.5;text-align:left}#status{position:absolute;bottom:5px;width:100%;font-size:13px;color:#dce6ea;letter-spacing:.8px}
button{margin:0 0 18px;padding:14px 22px;border:1px solid #ffe68d;border-radius:12px;background:linear-gradient(#dfb436,#8a5d13);font-weight:900;font-size:15px;color:#050505}button:disabled{opacity:.45}
</style></head><body>
<h1>ALPHABALLS</h1><div class="sub">MÉLANGEUR 03 — 6 EXTRACTIONS CONTINUES</div>
<div id="machine"><div id="drum"></div><div id="mouth"></div><div id="capture"></div><div id="gate"></div><div id="rail"></div><div id="trav"></div>
<div id="count">20 ALPHABALLS<br>6 À EXTRAIRE</div>
<div id="tray"><div class="slot active">1</div><div class="slot">2</div><div class="slot">3</div><div class="slot">4</div><div class="slot">5</div><div class="slot">6</div></div>
<div id="status">Prêt pour le tirage</div></div><button id="go">LANCER LE TIRAGE</button>
<script>
const letters=[..."BCDFGHJKLMNPQRSTVWXZ"],drum=document.querySelector("#drum"),machine=document.querySelector("#machine"),go=document.querySelector("#go"),trav=document.querySelector("#trav"),statusEl=document.querySelector("#status"),count=document.querySelector("#count"),slots=[...document.querySelectorAll(".slot")],gate=document.querySelector("#gate");
let balls=[],run=false,af,W,R,extracted=0;
function setup(){cancelAnimationFrame(af);drum.innerHTML="";balls=[];extracted=0;W=drum.clientWidth;R=W/2-19;letters.forEach((l,i)=>{let e=document.createElement("div");e.className="b";e.textContent=l;drum.appendChild(e);let a=i*2.399,r=35+(i%5)*(R-42)/4;balls.push({e,l,x:W/2+Math.cos(a)*r,y:W/2+Math.sin(a)*r,vx:(Math.random()-.5)*5,vy:(Math.random()-.5)*5})});slots.forEach((s,i)=>{s.className="slot"+(i===0?" active":"");s.textContent=i+1});paint();count.innerHTML="20 ALPHABALLS<br>6 À EXTRAIRE"}
function paint(){balls.forEach(b=>{b.e.style.left=b.x-15+"px";b.e.style.top=b.y-15+"px"})}
function physics(){if(!run)return;let c=W/2;for(let b of balls){b.vx+=(Math.random()-.5)*1.35-(b.y-c)*.0014;b.vy+=(Math.random()-.5)*1.35+(b.x-c)*.0014;let s=Math.hypot(b.vx,b.vy);if(s>7.2){b.vx*=7.2/s;b.vy*=7.2/s}b.x+=b.vx;b.y+=b.vy;let dx=b.x-c,dy=b.y-c,d=Math.hypot(dx,dy),lim=R-15;if(d>lim){let nx=dx/d,ny=dy/d;b.x=c+nx*lim;b.y=c+ny*lim;let q=b.vx*nx+b.vy*ny;b.vx-=1.9*q*nx;b.vy-=1.9*q*ny}}
for(let i=0;i<balls.length;i++)for(let j=i+1;j<balls.length;j++){let a=balls[i],b=balls[j],dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy);if(d>0&&d<29){let nx=dx/d,ny=dy/d,p=(29-d)/2;a.x-=nx*p;a.y-=ny*p;b.x+=nx*p;b.y+=ny*p;let q=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;if(q<0){a.vx+=q*nx*.75;a.vy+=q*ny*.75;b.vx-=q*nx*.75;b.vy-=q*ny*.75}}}paint();af=requestAnimationFrame(physics)}
const wait=m=>new Promise(r=>setTimeout(r,m));
function move(x0,y0,x1,y1,ms){let t0=performance.now();return new Promise(ok=>{function f(t){let p=Math.min(1,(t-t0)/ms),e=p*p*(3-2*p);trav.style.left=x0+(x1-x0)*e+"px";trav.style.top=y0+(y1-y0)*e+"px";p<1?requestAnimationFrame(f):ok()}requestAnimationFrame(f)})}
async function oneDraw(){
 statusEl.textContent="MÉLANGE… LAQUELLE VA TOMBER ?";run=true;physics();await wait(3000);
 let chosen=balls.reduce((a,b)=>Math.abs(b.x-W/2)*1.3+(W-b.y)<Math.abs(a.x-W/2)*1.3+(W-a.y)?b:a);
 run=false;cancelAnimationFrame(af);
 let mr=machine.getBoundingClientRect(),dr=drum.getBoundingClientRect(),sx=dr.left-mr.left+chosen.x-17,sy=dr.top-mr.top+chosen.y-17,cx=machine.clientWidth/2-17;
 chosen.e.style.visibility="hidden";trav.textContent=chosen.l;trav.style.display="grid";trav.style.left=sx+"px";trav.style.top=sy+"px";
 statusEl.textContent="ELLE APPROCHE…";await move(sx,sy,cx,370,900);statusEl.textContent="CAPTURE";await move(cx,370,cx,418,520);await wait(420);
 gate.style.opacity=".12";statusEl.textContent="CLIC — TRAPPE OUVERTE";await move(cx,418,cx,482,560);gate.style.opacity="1";
 let sl=slots[extracted].getBoundingClientRect(),ex=sl.left-mr.left+5,ey=sl.top-mr.top+5;statusEl.textContent="SORTIE "+(extracted+1)+" SUR 6";await move(cx,482,ex,ey,1050);
 trav.style.display="none";slots[extracted].innerHTML='<div class="out">'+chosen.l+'</div>';slots[extracted].classList.remove("active");
 balls=balls.filter(b=>b!==chosen);chosen.e.remove();extracted++;if(extracted<6)slots[extracted].classList.add("active");
 count.innerHTML=balls.length+" ALPHABALLS<br>"+(6-extracted)+" À EXTRAIRE";await wait(800);
}
async function full(){go.disabled=true;setup();for(let i=0;i<6;i++)await oneDraw();statusEl.textContent="TIRAGE TERMINÉ — 6 ALPHABALLS VERROUILLÉES";go.disabled=false;go.textContent="NOUVEAU TIRAGE"}
go.onclick=full;addEventListener("resize",()=>{if(!go.disabled)setup()});setup();
</script></body></html>
